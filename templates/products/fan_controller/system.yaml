# Chipova Forge: the board. The MCU platform, how the chip is wired to it, the sensors, the
# UART the device API talks to, the LEDs to show, and the analog side. Forge makes the
# firmware's board.h, the simulation's board and the module's schematic and PCB from this file.
platform: stm32f4_discovery
chip:
  # The chip talks SPI: the MCU's SPI1 (PA5 SCK, PA6 MISO, PA7 MOSI) and PA4 as its select.
  interface: spi1
  chip_select: PA4
  # The chip's interrupt pin -> the MCU pin that takes it (an external interrupt).
  irq:
    irq: PB1
  # The chip's pins that light an LED on the board (and here also switch the fan).
  leds: [alarm_led]
sensors:
  - name: temperature
    part: tmp1075
    bus: i2c1
    address: 0x48
console: usart2
leds:
  heartbeat: green
  alarm: red
firmware:
  sample_ms: 100
# The analog side: the enclosure as a thermal circuit (templates/analog/thermal_fan.yaml), solved
# by ngspice in step with the board every step_ms of virtual time. The chip's alarm pin switches
# the fan; the circuit's temperature is what the TMP1075 reads.
analog:
  model: thermal_fan
  step_ms: 50
  drives:
    fan: alarm_led
  sensors:
    temperature: temperature
  inputs:
    ambient: 25
    load: 1.5
